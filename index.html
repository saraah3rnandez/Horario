<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6E1423">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<title>Mi Horario DG3AM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600;700;800;900&display=swap">
<style>
/* Layout: banner "ahora" arriba, rejilla semanal tipo póster debajo (lista por día en móvil) */
:root{
  --bg:#FBF4E6;           /* vainilla */
  --paper:#FFFBF2;
  --ink:#6E1423;          /* granate: texto principal */
  --ink-soft:#97505C;     /* rosa granate apagado */
  --line:#EBDCC3;
  --pink:#F4C3CC; --pink-2:#E8A3B1; --pink-deep:#A3243B;
  --yellow:#F5E3AE; --yellow-2:#EED48A; --yellow-deep:#8A6100;
  --peach:#F8DEDD; --lilac:#E7C9CE; --cream:#F1E6CC;
  --stripe:rgba(110,20,35,.04);
  --b-bg:#6E1423; --b-fg:#FBF0DC; --f-bg:#A3475A;
  --shadow:none;
  --f-display:var(--f-body);
  --f-body:"Neue Haas Grotesk Text Pro","NeueHaasGroteskText Pro","Neue Haas Grotesk Display Pro","Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1113;--paper:#26171A;--ink:#F8ECD9;--ink-soft:#DDB3BA;--line:#3E2A2C;
  --pink:#5E1A2A;--pink-2:#7A2335;--pink-deep:#F4C3CC;
  --yellow:#574619;--yellow-2:#6B5720;--yellow-deep:#F5E3AE;
  --peach:#4A2530;--lilac:#4A3034;--cream:#3A2F22;--stripe:rgba(244,195,204,.04);--b-bg:#7A1528;--b-fg:#F8ECD9;--f-bg:#8E3A4C;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1113;--paper:#26171A;--ink:#F8ECD9;--ink-soft:#DDB3BA;--line:#3E2A2C;
  --pink:#5E1A2A;--pink-2:#7A2335;--pink-deep:#F4C3CC;
  --yellow:#574619;--yellow-2:#6B5720;--yellow-deep:#F5E3AE;
  --peach:#4A2530;--lilac:#4A3034;--cream:#3A2F22;--stripe:rgba(244,195,204,.04);--b-bg:#7A1528;--b-fg:#F8ECD9;--f-bg:#8E3A4C;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 48px;display:flex;flex-direction:column;gap:24px}
.lab{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,6.5vw,68px);line-height:.95;overflow-wrap:break-word;margin:8px 0 0;letter-spacing:-.04em}
.brand h1 .hl{font-weight:800;letter-spacing:-.045em}
.meta{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:13px;text-align:left}
.meta dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);align-self:center}
.meta dd{margin:0;font-weight:500}

/* Banner */
.now{border-radius:8px;background:var(--b-bg);color:var(--b-fg);
  padding:24px clamp(18px,3vw,32px);display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:end}
.now.is-free{background:var(--f-bg)}
.now > *{min-width:0}
.now .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.dot{width:7px;height:7px;border-radius:50%;background:var(--b-fg);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.now h2{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.6vw,48px);line-height:1.02;overflow-wrap:break-word;margin:10px 0 14px;letter-spacing:-.035em;text-wrap:balance}
.now .info{display:flex;flex-wrap:wrap;gap:8px 28px;font-weight:400;font-size:15px}
.now .info span{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.now .info span b{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.clock{text-align:right}
.clock .t{font-weight:200;font-size:clamp(40px,6vw,64px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.clock .d{font-weight:400;opacity:.8;margin-top:8px;font-size:13px;text-transform:capitalize}
.prog{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.bar{height:3px;background:color-mix(in srgb,var(--b-fg) 22%,transparent)}
.bar i{display:block;height:100%;background:var(--b-fg);transition:width .6s}
.prog .lbl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;flex-wrap:wrap;opacity:.85}
.next{grid-column:1/-1;font-weight:400;font-size:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--b-fg) 25%,transparent)}
.next b{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-right:10px;opacity:.7}

/* Leyenda */
.legend{display:flex;flex-wrap:wrap;gap:6px 20px}
.legend span{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.legend i{width:10px;height:10px;border-radius:2px}

/* Rejilla */
.board{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 18px 10px}
.grid{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(14,minmax(30px,auto));gap:0 6px;position:relative}
.dh{grid-row:1;display:flex;align-items:flex-end;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);min-width:0;padding:0 2px 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.dh.today{color:var(--ink);font-weight:800;border-bottom:2px solid var(--ink)}
.tm{grid-column:1;font-size:11.5px;font-weight:400;color:var(--ink-soft);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.rowline{grid-column:2/-1;border-top:1px solid var(--line)}
.col-today{grid-row:2/-1;background:var(--stripe);margin:0 -3px}
.cls{margin:2px 0;border-radius:4px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--ink);position:relative;z-index:2}
.cls .n{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:break-word}
.cls .h{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.cls .p{font-size:12.5px;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.room{margin-top:auto;padding-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.cls.live{outline:2px solid var(--ink);outline-offset:2px}
.cls.done{opacity:.5}
.cls.auto{background:repeating-linear-gradient(-45deg,var(--lilac) 0 1px,var(--paper) 1px 8px);border:1px solid var(--line);justify-content:center;align-items:center;text-align:center}
.cls.auto .n{font-weight:500;color:var(--ink-soft)}
.nowline{grid-column:2/-1;position:relative;z-index:1;pointer-events:none}
.nowline i{position:absolute;left:0;right:0;border-top:1.5px solid var(--pink-deep)}
.nowline i::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--pink-deep)}

/* Móvil: lista por día */
.tabs{display:none;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{flex:1 1 0;min-width:0;font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:10px 2px 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected="true"]{font-weight:800;color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
.list{display:none;flex-direction:column;gap:8px;padding-bottom:8px}
.list .cls{margin:0}
.list .gap{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:4px}

@media (max-width:760px){
  .grid{display:none}.tabs,.list{display:flex}
  .now{grid-template-columns:1fr;align-items:start}.clock{text-align:left;order:-1}
  .cls .n{font-size:18px}.cls .p{font-size:14px}
  .board{padding:8px 14px}
}
footer{font-size:12px;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.bar i{transition:none}}
/* Animación */
:root{--ease:cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes drawx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pink-deep) 45%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@keyframes fadein{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.intro .brand small{animation:rise .6s var(--ease) both}
.intro .brand h1{animation:rise .7s .08s var(--ease) both}
.intro .brand h1 .hl{display:inline-block;animation:rise .7s .2s var(--ease) both}
.intro .meta{animation:rise .7s .25s var(--ease) both}
.intro .now{animation:rise .8s .3s var(--ease) both}
.intro .now h2{animation:rise .8s .5s var(--ease) both}
.intro .now .info{animation:rise .8s .6s var(--ease) both}
.intro .bar i{animation:grow 1.4s .7s var(--ease) both}
.intro .legend span{animation:rise .5s var(--ease) both;animation-delay:calc(.55s + var(--i,0) * .05s)}
.intro .board{animation:rise .8s .55s var(--ease) both}
.intro .dh{animation:rise .5s var(--ease) both;animation-delay:calc(.7s + var(--i,0) * .06s)}
.intro .rowline{transform-origin:left;animation:drawx .9s .7s var(--ease) both}
.intro .cls,.swap .cls{animation:pop .6s var(--ease) both;animation-delay:calc(.8s + var(--i,0) * .055s)}
.swap .cls{animation-delay:calc(var(--i,0) * .06s)}
.swap .cls{animation-name:fadein}
.colon{animation:blink 2s steps(1) infinite}
.nowline i::before{animation:ring 1.8s ease-out infinite}
.cls{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.cls:not(.auto):hover{transform:translateY(-3px);box-shadow:0 10px 22px -12px color-mix(in srgb,var(--ink) 55%,transparent)}
.tabs button{transition:color .2s,border-color .25s var(--ease)}
.legend span{transition:color .2s}
.legend span:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>

<div class="wrap" lang="es">
  <header class="top">
    <div class="brand">
      <small>Escola d’Art i Superior de Disseny · València · 26/27</small>
      <h1>Mi <span class="hl">horario</span></h1>
    </div>
    <dl class="meta">
      <dt>Grupo</dt><dd>DG3AM · Turno mañana · A</dd>
      <dt>Estudios</dt><dd>3º Diseño Gráfico</dd>
      <dt>Periodo</dt><dd>Primer semestre</dd>
    </dl>
  </header>

  <section class="now" id="now" aria-live="polite"></section>

  <div class="legend" id="legend"></div>

  <section class="board">
    <div class="tabs" id="tabs" role="tablist" aria-label="Días"></div>
    <div class="list" id="list"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>Se actualiza sola cada 30 segundos con la hora de tu dispositivo.</footer>
</div>

<script>
const S = {
  ani:{name:"Taller de Animación Digital", short:"Animación", bg:"var(--pink)"},
  ide:{name:"Proyectos de Identidad Global", short:"Identidad", bg:"var(--yellow)"},
  com:{name:"Proyectos de Comunicación Global", short:"Comunicación", bg:"var(--peach)"},
  ges:{name:"Gestión del Diseño Gráfico", short:"Gestión", bg:"var(--cream)"},
  est:{name:"Estética y Tend. C. Diseño Gráfico", short:"Estética", bg:"var(--pink-2)"},
  aut:{name:"Trabajo autónomo / Actividades", short:"Autónomo", bg:"var(--lilac)", auto:true}
};
const T = {
  ani:"Daniel Morello Orts",
  ide:"Lourdes Vicenta Expósito Andrés",
  com:"Cristina",
  ges:"Ofelia Hiraldo Lores",
  est:"Antoni Alcañiz Bochons",
  aut:"—"
};
const R = {ani:"S.0", ide:"2.1", com:"2.1", ges:"2.1", est:"2.1", aut:"—"};
// día 1=lunes … 5=viernes
const H = [
  {d:1,s:"8:00",e:"10:30",k:"ani"},{d:1,s:"10:30",e:"12:30",k:"ide"},{d:1,s:"12:30",e:"14:30",k:"com"},
  {d:2,s:"8:30",e:"15:00",k:"aut"},
  {d:3,s:"8:00",e:"10:00",k:"com"},{d:3,s:"10:00",e:"12:00",k:"ges"},
  {d:4,s:"8:30",e:"10:30",k:"ide"},{d:4,s:"10:30",e:"13:00",k:"ani"},
  {d:5,s:"9:00",e:"11:00",k:"ges"},{d:5,s:"11:00",e:"14:00",k:"est"}
].map(c=>({...c,sm:toMin(c.s),em:toMin(c.e)}));
const DAYS=["","Lunes","Martes","Miércoles","Jueves","Viernes"];
const START=480, END=900; // 8:00–15:00

function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m}
function fmtDur(m){const h=Math.floor(m/60),r=m%60;return h?`${h} h ${r?r+" min":""}`.trim():`${r} min`}
function row(min){return 2+(min-START)/30}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let selDay=null;

let cardIdx=0;
function card(c,state,pos=""){
  pos+=`--i:${cardIdx++};`;
  const s=S[c.k];
  const cls=`cls${s.auto?" auto":""}${state==="live"?" live":""}${state==="done"?" done":""}`;
  if(s.auto) return `<div class="${cls}" style="${pos}"><div class="n">${s.name}</div><div class="h">${c.s} – ${c.e}</div></div>`;
  return `<div class="${cls}" style="${pos}background:${s.bg}">
    <div class="h">${c.s} – ${c.e}</div>
    <div class="n">${s.name}</div>
    <div class="p">${esc(T[c.k])}</div>
    <span class="room">Aula ${R[c.k]}</span></div>`;
}

function stateOf(c,day,min){
  if(c.d!==day) return "";
  if(min>=c.sm&&min<c.em) return "live";
  if(min>=c.em) return "done";
  return "";
}

function renderGrid(day,min){
  let h="<div></div>";
  for(let d=1;d<=5;d++) h+=`<div class="dh${d===day?" today":""}" style="grid-column:${d+1};--i:${d}">${DAYS[d]}</div>`;
  if(day>=1&&day<=5) h+=`<div class="col-today" style="grid-column:${day+1}"></div>`;
  for(let m=START;m<=END-30;m+=30){
    const r=row(m);
    h+=`<div class="tm" style="grid-row:${r}">${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}</div>`;
    h+=`<div class="rowline" style="grid-row:${r}"></div>`;
  }
  H.forEach(c=>{
    h+=card(c,stateOf(c,day,min),`grid-column:${c.d+1};grid-row:${row(c.sm)}/${row(c.em)};`);
  });
  if(day>=1&&day<=5&&min>=START&&min<=END){
    const off=((min-START)%30)/30*100;
    h+=`<div class="nowline" style="grid-row:${Math.floor(row(min))}"><i style="top:${off}%"></i></div>`;
  }
  document.getElementById("grid").innerHTML=h;
}

function renderList(day,min){
  cardIdx=0;
  const d=selDay;
  document.getElementById("tabs").innerHTML=[1,2,3,4,5].map(i=>
    `<button role="tab" id="tab${i}" aria-selected="${i===d}" data-d="${i}">${DAYS[i].slice(0,3)}${i===day?" •":""}</button>`).join("");
  const items=H.filter(c=>c.d===d);
  let h="",prev=null;
  items.forEach(c=>{
    if(prev!==null&&c.sm>prev) h+=`<div class="gap">Descanso · ${fmtDur(c.sm-prev)}</div>`;
    h+=card(c,stateOf(c,day,min));prev=c.em;
  });
  document.getElementById("list").innerHTML=h;
}

function renderBanner(now,day,min){
  const el=document.getElementById("now");
  const t=now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  const dstr=now.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  const clock=`<div class="clock"><div class="t">${t.replace(":",'<span class="colon">:</span>')}</div><div class="d">${dstr}</div></div>`;
  const live=H.find(c=>stateOf(c,day,min)==="live");
  // siguiente clase (hoy o próximos días)
  let next=null;
  for(let k=0;k<8&&!next;k++){
    const dd=((day-1+k)%7+7)%7+1;
    const cands=H.filter(c=>c.d===dd&&(k>0||c.sm>min)).sort((a,b)=>a.sm-b.sm);
    if(cands.length) next={c:cands[0],k};
  }
  const nextTxt=next?`${S[next.c.k].name} · ${next.k===0?"hoy":next.k===1?"mañana":DAYS[next.c.d].toLowerCase()} a las ${next.c.s}${S[next.c.k].auto?"":" · Aula "+R[next.c.k]}`:"";

  if(live){
    const s=S[live.k],left=live.em-min,pct=Math.round((min-live.sm)/(live.em-live.sm)*100);
    el.className="now";
    el.innerHTML=`<div>
      <span class="tag"><span class="dot"></span>Ahora en clase</span>
      <h2>${s.name}</h2>
      <div class="info">
        ${s.auto?"":`<span><b>Aula</b>${R[live.k]}</span><span><b>Profe</b>${esc(T[live.k])}</span>`}
        <span><b>Horario</b>${live.s} – ${live.e}</span>
      </div></div>${clock}
      <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>
      <div class="lbl"><span>${pct}% completado</span><span>Quedan ${fmtDur(left)}</span></div></div>
      ${next&&next.k===0?`<div class="next"><b>Después</b>${nextTxt}</div>`:""}`;
  }else{
    let title="Sin clase ahora",sub="";
    if(day===6||day===7){title="¡Es finde!";}
    else if(next&&next.k===0){title="Tiempo libre";sub=`Tu próxima clase empieza en ${fmtDur(next.c.sm-min)}.`;}
    else if(day>=1&&day<=5&&min>=START){title="Clases terminadas";sub="Por hoy ya está.";}
    el.className="now is-free";
    el.innerHTML=`<div>
      <span class="tag">Fuera de clase</span>
      <h2>${title}</h2>
      ${sub?`<div class="info"><span>${sub}</span></div>`:""}
      </div>${clock}
      ${next?`<div class="next"><b>Próxima</b>${nextTxt}</div>`:""}`;
  }
}

function render(){
  cardIdx=0;
  const now=new Date();
  const day=now.getDay()===0?7:now.getDay();
  const min=now.getHours()*60+now.getMinutes();
  if(selDay===null) selDay=day<=5?day:1;
  renderBanner(now,day,min);
  renderGrid(day,min);
  renderList(day,min);
}

document.getElementById("legend").innerHTML=Object.values(S).map((s,i)=>
  `<span style="--i:${i}"><i style="background:${s.bg}"></i>${s.short}</span>`).join("");
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;selDay=+b.dataset.d;const L=document.getElementById("list");L.classList.remove("swap");void L.offsetWidth;render();L.classList.add("swap");clearTimeout(window._sw);window._sw=setTimeout(()=>L.classList.remove("swap"),1000);
});
document.body.classList.add("intro");
render();
